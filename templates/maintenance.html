<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYCLICK - Maintenance</title>
<style>
  body { 
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; 
    background: radial-gradient(circle at center, #f5f1e8 0%, #ececec 60%, #d6d2c8 100%);
    font-family:system-ui; 
  }
  .wrap { text-align:center; padding:20px; }
  .hero {
    max-width:380px; width:85%; border-radius:24px;
    box-shadow: 0 25px 80px rgba(0,0,0,.25), 0 0 40px rgba(255,215,100,.3);
    animation: 
      floatIn 1.4s cubic-bezier(0.22,1,0.36,1),
      float 3.5s ease-in-out infinite 1.4s,
      shimmer 4s ease-in-out infinite 1.4s;
  }
  @keyframes floatIn {
    0% { opacity:0; transform: translateY(60px) scale(0.85) rotate(-2deg); filter: blur(8px); }
    100% { opacity:1; transform: translateY(0) scale(1) rotate(0); filter: blur(0); }
  }
  @keyframes float {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-15px) scale(1.02); }
  }
  @keyframes shimmer {
    0%,100% { box-shadow: 0 25px 80px rgba(0,0,0,.25), 0 0 40px rgba(255,215,100,.3); }
    50% { box-shadow: 0 30px 90px rgba(0,0,0,.3), 0 0 60px rgba(255,215,100,.5); }
  }
</style>
</head>
<body>
<div class="bg"></div>
<span class="sparkle" style="top:22%;left:28%;animation-delay:0s"></span>
<span class="sparkle" style="top:35%;right:26%;animation-delay:.7s"></span>
<span class="sparkle" style="bottom:30%;left:35%;animation-delay:1.4s"></span>
<img src="{{ url_for('static', filename='images/myclick-splash-final.webp') }}" alt="MYCLICK" class="hero">
   <h1 class="brand">MYCLICK</h1>
   <p class="tag">A Touch of Magic</p>
   <p class="url">www.MYClick.dk</p>
   <p class="services">Photography | Video | Model Shoots | Cinematic Style | Bridal Shoots | Portfolio | VFX</p>
   <div class="pill"><span class="dot"></span> Website under maintenance — back shortly with magic</div>
</body>
</html>
