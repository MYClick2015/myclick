<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MYCLICK - A Touch of Magic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;font-family:-apple-system,system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(212,175,55,.18) 0%,transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(212,175,55,.12) 0%,transparent 45%);pointer-events:none;z-index:-1}
.hero{max-width:420px;width:90%;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:float 4s ease-in-out infinite;margin-bottom:30px;display:block}
.brand{font-size:42px;font-weight:900;letter-spacing:-.02em;color:#111;line-height:1}
.tag{font-size:14px;letter-spacing:.3em;color:#888;text-transform:uppercase;margin-top:4px}
.url{color:#c0392b;font-size:16px;margin-top:12px;font-weight:500}
.services{font-size:10px;letter-spacing:.15em;color:#aaa;text-transform:uppercase;margin-top:18px;text-align:center}
.pill{margin-top:22px;background:white;border-radius:999px;padding:10px 18px;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#666;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.dot{width:8px;height:8px;background:#ff8fab;border-radius:50%;animation:blink 2s infinite;display:inline-block}
.sparkle{position:absolute;width:4px;height:4px;background:#d4af37;border-radius:50%;animation:sparkle 3s infinite;z-index:2}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="bg"></div>
<span class="sparkle" style="top:22%;left:28%"></span>
<span class="sparkle" style="top:35%;right:26%;animation-delay:.7s"></span>
<span class="sparkle" style="bottom:30%;left:35%;animation-delay:1.4s"></span>
<img class="hero" src="{{ url_for('static', filename='images/myclick-splash-final.webp') }}" alt="MYCLICK">
<h1 class="brand">MYCLICK</h1>
<p class="tag">A Touch of Magic</p>
<p class="url">www.MYClick.dk</p>
<p class="services">Photography | Video | Model Shoots | Cinematic Style | Bridal Shoots | Portfolio | VFX</p>
<div class="pill"><span class="dot"></span> Website under maintenance — back shortly with magic</div>
</body>
</html>
