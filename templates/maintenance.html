<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYCLICK - Maintenance</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;position:relative;overflow:hidden;padding:40px 20px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 20% 30%,rgba(212,175,55,.18) 0%,transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(212,175,55,.12) 0%,transparent 45%),radial-gradient(ellipse at 50% 10%,rgba(255,215,100,.1) 0%,transparent 40%),#f5f5f0}
.hero{max-width:420px;width:90%;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:float 4s ease-in-out infinite;margin-bottom:30px;display:block;position:relative;z-index:1}
.brand{font-size:42px;font-weight:800;letter-spacing:-.02em;margin-top:0;line-height:1;color:#111}
.tag{font-size:14px;letter-spacing:.3em;color:#888;margin-top:0;text-transform:uppercase}
.url{color:#e63946;font-size:16px;margin-top:12px;font-weight:500;letter-spacing:.02em}
.services{font-size:10px;letter-spacing:.15em;color:#aaa;text-transform:uppercase;margin-top:18px}
.pill{margin-top:22px;background:#fff;border-radius:999px;padding:10px 18px;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#666;box-shadow:0 4px 20px rgba(0,0,0,.06);z-index:1}
.dot{width:8px;height:8px;background:#ff8fab;border-radius:50%;animation:blink 2s infinite}
.sparkle{position:absolute;width:4px;height:4px;background:#d4af37;border-radius:50%;animation:sparkle 3s infinite;z-index:2}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="bg"></div>
<span class="sparkle" style="top:22%;left:28%;animation-delay:0s"></span>
<span class="sparkle" style="top:35%;right:26%;animation-delay:.7s"></span>
<span class="sparkle" style="bottom:30%;left:35%;animation-delay:1.4s"></span>
   <img src="https://raw.githubusercontent.com/MYClick2015/myclick/main/static/images/myclick-splash-final.webp" alt="MYCLICK" style="max-width:420px;width:90%;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.15);display:block;margin:0 auto 30px;">
   <h1 class="brand">MYCLICK</h1>
   <p class="tag">A Touch of Magic</p>
   <p class="url">www.MYClick.dk</p>
   <p class="services">Photography | Video | Model Shoots | Cinematic Style | Bridal Shoots | Portfolio | VFX</p>
   <div class="pill"><span class="dot"></span> Website under maintenance — back shortly with magic</div>
</body>
</html>
